<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ba3ff"/>
      <stop offset="100%" stop-color="#3d8bfd"/>
    </linearGradient>
  </defs>
  <!-- rounded app background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- camera body -->
  <rect x="72" y="118" width="368" height="252" rx="36" fill="#151b24" stroke="url(#accent)" stroke-width="14"/>
  <!-- lens outer -->
  <circle cx="256" cy="244" r="86" fill="#0b0d10" stroke="#3fb950" stroke-width="12"/>
  <!-- lens ring -->
  <circle cx="256" cy="244" r="58" fill="none" stroke="#2a3544" stroke-width="10"/>
  <!-- lens core -->
  <circle cx="256" cy="244" r="34" fill="url(#accent)"/>
  <circle cx="242" cy="230" r="10" fill="#ffffff" opacity="0.35"/>
  <!-- status LED -->
  <circle cx="392" cy="160" r="12" fill="#3fb950"/>
  <!-- stand -->
  <rect x="208" y="380" width="96" height="22" rx="8" fill="#3d5a80"/>
  <rect x="156" y="410" width="200" height="28" rx="12" fill="url(#accent)"/>
  <!-- grid hint (multi-cam) -->
  <g opacity="0.55" fill="#8ab4f8">
    <rect x="98" y="148" width="28" height="20" rx="4"/>
    <rect x="134" y="148" width="28" height="20" rx="4"/>
    <rect x="98" y="176" width="28" height="20" rx="4"/>
    <rect x="134" y="176" width="28" height="20" rx="4"/>
  </g>
</svg>
